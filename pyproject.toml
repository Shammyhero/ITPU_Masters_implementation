[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airs-bench"
version = "0.1.0"
description = "Benchmark and measurement framework for the data infrastructure gap in agentic AI systems (AIRS / AIST)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shamsiddin Khamidov" }]
# Core package (agentic_faults + airs calculator) is stdlib-only by design:
# it must be installable anywhere the score is computed.
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=15", "datasets>=2.19", "requests>=2.31"]
# Serves only infra_unused/ (quarantined 2026-09-13). No experiment, analysis
# or test imports these; results are simulated archetypes, see infra_unused/README.md.
pipelines = ["confluent-kafka>=2.3", "psycopg2-binary>=2.9", "prometheus-client>=0.20"]
agents = ["langchain>=0.2", "langchain-openai>=0.1", "langchain-anthropic>=0.1"]
analysis = [
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter",
]
dev = ["pytest>=8", "ruff>=0.4"]
ci = [
    "pytest>=8",
    "ruff>=0.4",
    "pandas>=2.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
