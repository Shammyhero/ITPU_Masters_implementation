[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airs-bench"
version = "0.1.0"
description = "Benchmark and measurement framework for the data infrastructure gap in agentic AI systems (AIRS / AIST)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shamsiddin Khamidov" }]
# The decided install is `pip install airs-bench`, then `airs serve`, so the web
# stack is a core dependency. The scoring core stays stdlib-only at import time:
# agentic_faults, the AIRS calculator, `airs probe` and `airs gate` never import it
# (pinned by tests/test_server.py), so a pipeline step running `airs gate` loads
# no web framework. Floors are the versions the test suite was run against.
dependencies = ["fastapi>=0.141", "uvicorn>=0.52"]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=15", "datasets>=2.19", "requests>=2.31"]
# Serves only infra_unused/ (quarantined 2026-09-13). No experiment, analysis
# or test imports these; results are simulated archetypes, see infra_unused/README.md.
pipelines = ["confluent-kafka>=2.3", "psycopg2-binary>=2.9", "prometheus-client>=0.20"]
agents = ["langchain>=0.2", "langchain-openai>=0.1", "langchain-anthropic>=0.1"]
analysis = [
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter",
]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.28"]
ci = [
    "pytest>=8",
    "ruff>=0.4",
    "httpx>=0.28",
    "pandas>=2.0",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
]

[project.scripts]
airs = "airsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files the installed package reads. setuptools ships only .py files
# unless told otherwise: a wheel built on 13 Sep installed a probe that could not
# find its calibrated weights. `make ci` installs editable and cannot see that;
# `make dist-check` builds the wheel and can. tests/test_cli.py pins this list.
[tool.setuptools.package-data]
airsbench = ["airs/*.json", "runner/*.sql", "server/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
