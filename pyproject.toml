[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airs-bench"
version = "0.1.0"
description = "Benchmark and measurement framework for the data infrastructure gap in agentic AI systems (AIRS / AIST)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shamsiddin Khamidov" }]
# Core package (agentic_faults + airs calculator) is stdlib-only by design:
# it must be installable anywhere the score is computed.
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=15", "datasets>=2.19", "requests>=2.31"]
pipelines = ["confluent-kafka>=2.3", "psycopg2-binary>=2.9", "prometheus-client>=0.20"]
agents = ["langchain>=0.2", "langgraph>=0.1", "langchain-openai>=0.1", "scikit-learn>=1.4"]
analysis = [
    "scipy>=1.12",
    "pingouin>=0.5",
    "ruptures>=1.1",
    "statsmodels>=0.14",
    "seaborn>=0.13",
    "jupyter",
]
demo = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
